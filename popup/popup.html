<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Feed Warrior</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" type="text/css" href="/assets/toastify.min.css">
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <div class="header-container">
      <div class="header-brand">
        <img src="/assets/icon128.png" width="36" height="36" alt="RSS Feed Warrior Logo">
        <div class="header-text">
          <h1 class="header-title">RSS Feed Warrior</h1>
          <span class="version" aria-label="Extension version"></span>
        </div>
      </div>
      <div class="header-icons">
        <a href="https://trakteer.id/akbarhlubis/tip"
           class="icon-btn trakteer"
           target="_blank"
           rel="noopener noreferrer"
           title="Donate"
           aria-label="Donate via Trakteer">
          <i class="bi bi-heart-fill" aria-hidden="true"></i>
        </a>
        <button id="check-update-btn" class="icon-btn" title="Check for Update" aria-label="Check for update">
          <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <!-- UPDATE BANNER (hidden by default, shown by JS when new version detected) -->
    <div id="update-banner" class="update-banner" hidden>
      <div class="update-banner-content">
        <i class="bi bi-download" aria-hidden="true"></i>
        <span id="update-banner-msg">New version available!</span>
      </div>
      <div class="update-banner-actions">
        <button id="update-download-btn" class="btn btn-sm btn-primary">
          <i class="bi bi-cloud-download" aria-hidden="true"></i> Download
        </button>
        <button id="update-dismiss-btn" class="icon-btn" aria-label="Dismiss update notification">
          <i class="bi bi-x" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <!-- FEEDS LIST (Primary — shown first) -->
    <div class="urls-section" id="urls-section">
      <div class="section-header">
        <h2>Feeds</h2>
        <div class="section-actions">
          <button id="export-btn" class="icon-btn" title="Export Feeds" aria-label="Export feeds to JSON">
            <i class="bi bi-download" aria-hidden="true"></i>
          </button>
          <button id="import-btn" class="icon-btn" title="Import Feeds" aria-label="Import feeds from JSON">
            <i class="bi bi-upload" aria-hidden="true"></i>
          </button>
          <input type="file" id="import-file-input" accept=".json" hidden>
          <button id="add-feed-toggle-btn" class="btn btn-sm btn-outline" aria-expanded="false" aria-controls="add-url-section">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> Add Feed
          </button>
        </div>
      </div>

      <!-- SEARCH & FILTER BAR -->
      <div class="filter-bar">
        <div class="search-wrapper">
          <i class="bi bi-search search-icon" aria-hidden="true"></i>
          <input
            type="search"
            id="search-input"
            placeholder="Search feeds..."
            aria-label="Search feeds"
            autocomplete="off">
        </div>
        <select id="filter-select" aria-label="Filter feeds">
          <option value="all">All</option>
          <option value="new">New</option>
          <option value="error">Error</option>
          <option value="paused">Paused</option>
        </select>
      </div>

      <!-- FEED LIST -->
      <div
        id="urls-list"
        role="list"
        aria-label="Monitored RSS feeds"
        aria-live="polite">
        <!-- Loading skeleton (replaced by JS after data loads) -->
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
      </div>
    </div>

    <!-- ADD FEED FORM (Secondary — collapsed by default) -->
    <div class="add-url-section" id="add-url-section" hidden>
      <div class="section-header">
        <h2>Add Feed</h2>
        <button id="close-add-form-btn" class="icon-btn" aria-label="Close add feed form">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
      <form id="add-url-form" novalidate>
        <div class="input-group">
          <label for="url-input">RSS / Atom URL <span class="required-star" aria-hidden="true">*</span></label>
          <input type="url" id="url-input" placeholder="https://example.com/feed.atom" required autocomplete="off">
          <span class="input-hint" id="url-hint">Must start with https:// or http://</span>
        </div>
        <div class="input-group">
          <label for="name-input">Name <span class="required-star" aria-hidden="true">*</span></label>
          <input type="text" id="name-input" placeholder="Site name" required autocomplete="off" maxlength="50">
        </div>
        <div class="input-group">
          <label for="interval-input">Check interval (minutes) <span class="required-star" aria-hidden="true">*</span></label>
          <input type="number" id="interval-input" min="1" max="1440" value="30" required>
          <span class="input-hint">Min: 1. Recommended: 30+ to preserve battery.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> Add Feed
        </button>
      </form>
      <div class="footer">
        <p>Made with <i class="bi bi-heart-fill" aria-hidden="true"></i> by Akbarhlubis</p>
      </div>
    </div>

  </div>

  <script type="text/javascript" src="/assets/toastify.js"></script>
  <script src="popup.js"></script>
</body>
</html>
